<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кибер-Кот: Забавная Стрелялка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
  background: #000;
}
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #0f0;
  font-size: 18px;
  text-shadow: 0 0 5px #0f0;
  pointer-events: none;
  z-index: 10;
}
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  z-index: 20;
  text-align: center;
  padding: 20px;
}
#overlay h1 {
  font-size: 2.5em;
  margin-bottom: 20px;
  color: #0ff;
  text-shadow: 0 0 10px #0ff;
}
#overlay p {
  font-size: 1.2em;
  margin-bottom: 30px;
  line-height: 1.5;
}
button {
  background: #0f0;
  color: #000;
  border: none;
  padding: 15px 30px;
  font-size: 1.2em;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 0 15px #0f0;
}
button:active {
  transform: scale(0.95);
}
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  Счёт: <span id="score">0</span> | Жизни: <span id="lives">❤️❤️❤️</span> | Рекорд: <span id="high">0</span>
</div>
<div id="overlay">
  <h1>🐱 Кибер-Кот</h1>
  <p>Защити галактику от смешных пришельцев!<br>Стреляй лазерами и не дай им добраться до низа.</p>
  <button id="startBtn">Начать Игру</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const uiScore = document.getElementById('score');
const uiLives = document.getElementById('lives');
const uiHigh = document.getElementById('high');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// Game state (объявляем до resize)
let W = 0, H = 0;
let player = null;
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];
let score = 0;
let lives = 3;
let highScore = parseInt(localStorage.getItem('cybercat_high') || '0', 10);
let gameRunning = false;
let spawnTimer = 0;
let difficulty = 1;
let keys = {};
let touchX = null;
let lastShot = 0;
let autoFireId = null;

uiHigh.textContent = highScore;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (player) {
    player.y = H - 100;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
  }
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function beep(freq, dur = 0.1, type = 'square', vol = 0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  o.frequency.value = freq;
  o.type = type;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}

function initGame() {
  player = {
    x: W / 2 - 30,
    y: H - 100,
    w: 60,
    h: 60,
    speed: 8
  };
  bullets = [];
  enemies = [];
  particles = [];
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() * 2 + 0.5,
      sp: Math.random() * 1.5 + 0.5
    });
  }
  score = 0;
  lives = 3;
  difficulty = 1;
  spawnTimer = 0;
  lastShot = 0;
  updateUI();
}

function updateUI() {
  uiScore.textContent = score;
  uiLives.textContent = '❤️'.repeat(Math.max(0, lives));
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('cybercat_high', String(highScore));
    uiHigh.textContent = highScore;
  }
}

const enemyTypes = [
  { e: '👽', pts: 10, sp: 1.5 },
  { e: '👾', pts: 15, sp: 1.8 },
  { e: '🛸', pts: 20, sp: 2.2 },
  { e: '🤡', pts: 12, sp: 1.6 },
  { e: '👻', pts: 18, sp: 2.0 },
  { e: '🧟', pts: 25, sp: 1.4 },
  { e: '💩', pts: 30, sp: 2.5 },
  { e: '🦠', pts: 8, sp: 1.2 },
  { e: '🐙', pts: 22, sp: 1.9 },
  { e: '🐸', pts: 14, sp: 1.7 }
];

function spawnEnemy() {
  const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
  const size = 40 + Math.random() * 20;
  enemies.push({
    x: Math.random() * Math.max(1, W - size),
    y: -size,
    w: size,
    h: size,
    emoji: type.e,
    speed: type.sp * difficulty,
    points: type.pts
  });
}

function shoot() {
  if (!gameRunning || !player) return;
  const now = Date.now();
  if (now - lastShot < 150) return;
  lastShot = now;

  bullets.push({
    x: player.x + player.w / 2 - 3,
    y: player.y,
    w: 6,
    h: 15,
    speed: 12
  });
  beep(800, 0.05, 'square', 0.05);
}

function explode(x, y, color = '#ff0') {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20,
      color
    });
  }
  beep(200, 0.15, 'sawtooth', 0.1);
}

function update() {
  if (!gameRunning || !player) return;

  // Stars
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.y += s.sp;
    if (s.y > H) {
      s.y = 0;
      s.x = Math.random() * W;
    }
  }

  // Player movement
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (touchX !== null) {
    player.x = touchX - player.w / 2;
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Manual shoot on space
  if (keys['Space']) {
    shoot();
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= bullets[i].speed;
    if (bullets[i].y < -20) bullets.splice(i, 1);
  }

  // Enemies
  spawnTimer++;
  if (spawnTimer > Math.max(30, 80 - difficulty * 5)) {
    spawnEnemy();
    spawnTimer = 0;
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    if (e.y > H) {
      enemies.splice(i, 1);
      lives--;
      beep(100, 0.3, 'sawtooth', 0.15);
      updateUI();
      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Collisions: bullets vs enemies
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (b.x < e.x + e.w && b.x + b.w > e.x &&
          b.y < e.y + e.h && b.y + b.h > e.y) {
        explode(e.x + e.w / 2, e.y + e.h / 2);
        score += e.points;
        bullets.splice(bi, 1);
        enemies.splice(ei, 1);
        difficulty = 1 + Math.floor(score / 100);
        updateUI();
        break;
      }
    }
  }

  // Collisions: player vs enemies
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];
    if (player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      explode(e.x + e.w / 2, e.y + e.h / 2, '#f00');
      enemies.splice(ei, 1);
      lives--;
      beep(80, 0.4, 'sawtooth', 0.2);
      updateUI();
      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.5 + Math.random() * 0.5;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 50);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;

  // Bullets (тень задаётся ДО отрисовки)
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 10;
  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.shadowBlur = 0;

  // Enemies
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  enemies.forEach(e => {
    ctx.font = `${e.w}px Arial`;
    ctx.fillText(e.emoji, e.x + e.w / 2, e.y + e.h / 2);
  });

  // Player
  if (gameRunning && player) {
    ctx.font = '60px Arial';
    ctx.fillText('🐱', player.x + player.w / 2, player.y + player.h / 2);
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.fillRect(player.x + player.w / 2 - 2, player.y - 10, 4, 10);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  touchX = null;
  keys = {};
  if (autoFireId) {
    clearInterval(autoFireId);
    autoFireId = null;
  }
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>💥 Игра Окончена!</h1>
    <p>Твой счёт: <strong>${score}</strong><br>Рекорд: ${highScore}</p>
    <button id="restartBtn">Играть Снова</button>
  `;
  document.getElementById('restartBtn').onclick = startGame;
  beep(50, 0.8, 'sawtooth', 0.2);
}

function startGame() {
  initAudio();
  initGame();
  gameRunning = true;
  overlay.classList.add('hidden');
  if (autoFireId) clearInterval(autoFireId);
  autoFireId = setInterval(() => {
    if (gameRunning) shoot();
  }, 180);
}

// Input
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && gameRunning) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
});
window.addEventListener('blur', () => {
  keys = {};
  touchX = null;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length > 0) {
    touchX = e.touches[0].clientX;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length > 0) {
    touchX = e.touches[0].clientX;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => {
  touchX = null;
});
canvas.addEventListener('touchcancel', () => {
  touchX = null;
});

startBtn.onclick = startGame;

// Инициализируем фон и запускаем цикл
initGame();
gameLoop();
</script>
</body>
</html>
